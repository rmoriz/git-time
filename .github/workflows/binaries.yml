name: Binaries

# Reusable: builds the four shipped binaries. Called by CI on every push and by
# Release on a tag, so a release can never fail on a target that CI never built.
#
# One job per operating system, with both of its targets built one after the
# other inside that job. The macOS job is the account's *only* macOS job per run
# on purpose: about two concurrent macOS runners exist behind a fifteen-minute
# queue wall, and a cancelled queued job fails the run. CI therefore has no
# macOS test job of its own — it asks the macOS job here to run the suite first
# (`test: true`), so tests and the darwin build share one runner instead of
# competing for two.
on:
  workflow_call:
    inputs:
      retention-days:
        description: How long the workflow artifacts are kept.
        type: number
        default: 14
      test:
        description: Run fmt, clippy and the suite in the macOS job before building.
        type: boolean
        default: false
      tolerant:
        description: >-
          Do not fail the run when the macOS job is cancelled in the queue. CI
          sets this; a tag does not, so a release never goes out incomplete.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: linux (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build and stage
        run: |
          set -eu
          # A target dir per target: both invocations share this job, and cargo
          # would otherwise reuse host build scripts that the first container
          # linked against a newer glibc than the second container has.
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cross build --release --locked --target "$target" --target-dir "target/$target" -p git-time-cli
            sh scripts/package.sh "$target" "target/$target/$target/release/git-time"
          done

      - name: Smoke test the native binary
        run: |
          set -eu
          ./dist-binaries/git-time-x86_64-unknown-linux-musl --version
          ./dist-binaries/git-time-x86_64-unknown-linux-musl --help >/dev/null

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-time-linux
          path: dist-binaries/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  macos:
    name: macos (darwin)
    # The Intel pool, not `macos-latest`: GitHub reports arm64 capacity
    # constraints, and an Intel runner builds both targets anyway (arm64 by
    # cross-compilation). Stay on a pinned image, not a moving label.
    runs-on: macos-15-intel
    continue-on-error: ${{ inputs.tolerant }}
    # The macOS pool is short enough to queue a job past the queue wall (fifteen
    # minutes, then cancellation), and the suite alone takes ~9 minutes on the
    # three-core Intel runner with the two-target build trailing it: twelve
    # minutes cut the build off, thirty is the measured time plus room.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-darwin-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-darwin-

      # macOS ships LibreSSL at /usr/bin/openssl, and LibreSSL's `cms` has
      # neither `-cades` nor `-econtent_type`: the fixture tokens in the core
      # suite are built with both. Homebrew's OpenSSL is on the image, so put it
      # first for the steps below and fail loudly if it is not an OpenSSL.
      - name: Use OpenSSL 3 for the suite
        if: inputs.test
        run: |
          set -eu
          if ! prefix="$(brew --prefix openssl@3 2>/dev/null)"; then
            brew install openssl@3 >/dev/null
            prefix="$(brew --prefix openssl@3)"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/openssl" version | grep -q '^OpenSSL 3'

      - name: Suite
        if: inputs.test
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build and stage
        run: |
          set -eu
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p git-time-cli
            sh scripts/package.sh "$target" "target/$target/release/git-time"
          done

      - name: Smoke test the native binary
        run: |
          set -eu
          ./dist-binaries/git-time-x86_64-apple-darwin --version
          ./dist-binaries/git-time-x86_64-apple-darwin --help >/dev/null

      # A job that GitHub kills mid-step is already marked completed when the
      # upload starts, and the artifact call then answers `403 job is completed`
      # while the runner is still going. On a push that is a second red for the
      # same accident; on a tag it stays loud.
      - name: Upload the artifacts
        if: ${{ !cancelled() }}
        continue-on-error: ${{ inputs.tolerant }}
        uses: actions/upload-artifact@v4
        with:
          name: git-time-macos
          path: dist-binaries/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
