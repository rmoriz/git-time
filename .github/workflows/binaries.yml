name: Binaries

# Reusable: builds the four shipped binaries. Called by CI on every push and by
# Release on a tag, so a release can never fail on a target that CI never built.
#
# One job per operating system, with both of its targets built one after the
# other inside that job: two runners in flight instead of four. A tag push
# starts CI and Release simultaneously, and four parallel jobs — two of them
# macOS — overran the macOS runner slots, so a job sat queued until something
# cancelled it before a single step had run.

on:
  workflow_call:
    inputs:
      retention-days:
        description: How long the workflow artifacts are kept.
        type: number
        default: 14

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: linux (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build and package
        run: |
          set -eu
          # A target dir per target: both invocations share this job, and cargo
          # would otherwise reuse host build scripts that the first container
          # linked against a newer glibc than the second container has.
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cross build --release --locked --target "$target" --target-dir "target/$target" -p git-time-cli
            sh scripts/package.sh "$target" "target/$target/$target/release/git-time"
          done

      - name: Smoke test the native binary
        run: |
          set -eu
          ./dist-binaries/git-time-x86_64-unknown-linux-musl/git-time --version
          ./dist-binaries/git-time-x86_64-unknown-linux-musl/git-time --help >/dev/null

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-time-linux
          path: dist-binaries/*.tar.gz*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  macos:
    name: macos (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-darwin-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-darwin-

      - name: Build and package
        run: |
          set -eu
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p git-time-cli
            sh scripts/package.sh "$target" "target/$target/release/git-time"
          done

      - name: Smoke test the native binary
        run: |
          set -eu
          ./dist-binaries/git-time-aarch64-apple-darwin/git-time --version
          ./dist-binaries/git-time-aarch64-apple-darwin/git-time --help >/dev/null

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-time-macos
          path: dist-binaries/*.tar.gz*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
