name: CI

# fmt, clippy, the suite and the dependency policy on branches and pull
# requests.
#
# The binaries are built once, by `release.yml`, on a version tag: an ordinary
# push has nobody waiting for four targets, and they cost a scarce macOS runner.
# Tags are therefore left out of this workflow entirely (`branches` below matches
# branches only) and handled by the release build, which runs the same suite on
# macOS as well before it packages.
#
# A change under `docs/` or to a markdown file cannot move a byte of the binary,
# so it runs no compiler here. That also skips the check runs, so a branch
# protected on them would wait on checks that never start; this repository pushes
# straight to `main` and tolerates that. The tag build is a full run either way.
on:
  push:
    branches: ['**']
    paths-ignore: &docs-only
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore: *docs-only

permissions:
  contents: read

# A new push supersedes the previous run: a stale suite run that finishes after
# the newer one would otherwise be the result GitHub reports for the branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: openssl is available
        run: openssl version

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  deny:
    name: advisories, licenses, bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
