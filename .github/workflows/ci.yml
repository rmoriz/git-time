name: CI

# fmt, clippy and the suite on branches and pull requests.
#
# The binaries are built once, by `release.yml`, on a version tag: an ordinary
# push has nobody waiting for four targets, and they cost a scarce macOS runner.
# Tags are therefore left out of this workflow entirely (`branches` below matches
# branches only) and handled by the release build, which runs the same suite on
# macOS as well before it packages.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous run: a stale suite run that finishes after
# the newer one would otherwise be the result GitHub reports for the branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: openssl is available
        run: openssl version

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
