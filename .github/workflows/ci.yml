name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous run: without this, queued macOS jobs from
# stale commits hold the runner pool and the binaries job never starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps: &test-steps
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: openssl is available
        run: openssl version

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # macOS is scarce — about two concurrent runners behind a fifteen-minute queue
  # wall — and a tag push runs the same suite again inside Release. On a tag the
  # Linux job above still tests, so the release's own macOS build gets a runner.
  #
  # A job-level `if` cannot read `matrix`, hence a separate job rather than a
  # matrix leg.
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps: *test-steps

  binaries:
    name: binaries
    # Deliberately not gated on `test`: the artifacts are useful on their own,
    # and waiting for a scarce macOS runner would delay every Linux build.
    #
    # Skipped on tags: the Release workflow builds the same four targets and
    # publishes them, so building them twice only spends macOS runner slots.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/binaries.yml
    with:
      retention-days: 14
