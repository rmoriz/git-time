name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous run: without this, queued macOS jobs from
# stale commits hold the runner pool and the binaries job never starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: openssl is available
        run: openssl version

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  binaries:
    name: binaries
    # Deliberately not gated on `test`: the artifacts are useful on their own,
    # and waiting for a scarce macOS runner would delay every Linux build.
    #
    # Skipped on tags: the Release workflow builds the same four targets and
    # publishes them, so building them twice only spends macOS runner slots.
    #
    # `test: true` puts the macOS suite in the macOS job, so a run needs one
    # macOS runner rather than one for the tests and one for the build. The
    # account serves about two such runners and cancels a job that queues for
    # fifteen minutes, which fails the run.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/binaries.yml
    with:
      retention-days: 14
      test: true
      # macOS runners are frequently unschedulable and cancel after fifteen
      # minutes; that must not redden every push. A tag still demands them.
      tolerant: true
