name: Debug (Intel macOS)

# One-shot probe: the seal tests fail only on the Intel macOS runner, so this
# runs just that file there with the failure diagnostics turned on.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  hook-flows:
    name: hook flows on macos-15-intel
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Seal tests
        run: cargo test -p git-time-cli --test hook_flows -- --nocapture

      - name: Environment
        if: always()
        run: |
          sysctl -n hw.ncpu hw.memsize
          ulimit -a
          sw_vers
