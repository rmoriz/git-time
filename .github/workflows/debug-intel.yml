name: Debug (Intel macOS)

# Probe for the Intel macOS runner: the suite meets a different `openssl` there
# (Homebrew 1.1.1, ahead of /usr/bin), so this runs the token and seal tests with
# the failure diagnostics turned on and names the binary it found. Kept because
# the macOS suite now only runs inside the tag build, so getting a readable red
# leg otherwise costs a release attempt. It reproduces that leg, not the tag
# build's suite: no `openssl@3` swap and no fmt/clippy here.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  hook-flows:
    name: hook flows on macos-15-intel
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Cache the cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Which openssl
        run: |
          which -a openssl
          openssl version -a
          printf '%s\n' "$PATH"

      - name: Token verification
        run: cargo test -p git-time-core --test verify_token -- --nocapture

      - name: Seal tests
        run: cargo test -p git-time-cli --test hook_flows -- --nocapture

      - name: Environment
        if: always()
        run: |
          sysctl -n hw.ncpu hw.memsize
          ulimit -a
          sw_vers
