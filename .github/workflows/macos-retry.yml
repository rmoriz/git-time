name: macOS retry

# GitHub's macOS pool kills jobs with "an internal error when running your job"
# often enough that an ordinary run goes red without anything being wrong, and a
# job-level `continue-on-error` does not cover a *cancelled* job, so neither
# workflow can swallow it (see `.github/workflows/binaries.yml`). Rerun the
# failed jobs once instead of waiting for a human.
#
# Any failed CI **or** release run is retried once. CI is here because it fails
# the same way; Release matters more, since its macOS job runs the suite, and a
# lost runner there leaves the tag unpublished — so a rerun there covers the
# failed job and the publish that needs it.
#
# A genuinely broken macOS job also gets this one retry and then stays red: the
# guard is `run_attempt == 1`, and this workflow is named neither CI nor Release,
# so rerunning does not trigger another round.
on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh run rerun "${{ github.event.workflow_run.id }}" --failed
