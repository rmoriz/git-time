name: macOS retry

# GitHub's macOS pool kills jobs with "an internal error when running your job"
# often enough that an ordinary push goes red without anything being wrong, and
# a job-level `continue-on-error` does not cover a *cancelled* job, so CI cannot
# swallow it (see `.github/workflows/binaries.yml`). Rerun the failed jobs once
# instead of waiting for a human.
#
# A genuinely broken macOS job also gets this one retry and then stays red: the
# guard is `run_attempt == 1`, and this workflow is not named CI, so rerunning
# does not trigger another round.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh run rerun "${{ github.event.workflow_run.id }}" --failed
