name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Re-pointing a tag supersedes its run: the stale one would otherwise hold
# macOS runner slots and publish assets from a commit nobody points at.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    uses: ./.github/workflows/binaries.yml
    with:
      retention-days: 7

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine the checksums
        run: |
          set -eu
          cd dist
          ls -l
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm ./*.tar.gz.sha256
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
