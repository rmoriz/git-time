name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Re-pointing a tag supersedes its run: the stale one would otherwise hold
# macOS runner slots and publish assets from a commit nobody points at.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheapest check runs alone and first: nothing else starts before it, so a
  # tag that disagrees with the manifest fails in seconds instead of after four
  # targets and a macOS queue.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with the manifest would publish binaries whose
      # `--version` names another release, and nothing downstream would notice.
      - name: Tag matches the manifest
        run: |
          set -eu
          # Anchored to the section: a root-level `version` added later would
          # otherwise make the match multi-line and the message misleading.
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$(printf '%s\n' "$version" | wc -l)" -eq 1 || {
            echo "::error::expected exactly one workspace.package version, got: ${version:-<none found>}"
            exit 1
          }
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          }

  # A tag triggers nothing else (CI skips tags), so nothing makes the publish
  # wait for the suite: without this gate a failing suite still publishes.
  test:
    needs: preflight
    runs-on: ubuntu-latest
    # The default is six hours; `release` waits on this job, so a stall has to
    # fail long before that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The only place the four targets are built. The macOS job runs the suite
  # first and the publish below needs this job, so a tag tests macOS before it
  # publishes anything.
  binaries:
    needs: preflight
    uses: ./.github/workflows/binaries.yml
    with:
      retention-days: 7

  release:
    needs: [binaries, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The build jobs stage bare binaries, so the release attaches exactly
      # those: no archive and no checksum file to fetch alongside, one asset per
      # target, named after it.
      - name: Check the assets
        run: |
          set -eu
          cd dist
          chmod +x git-time-*
          # Four targets, and each one has to be an executable of this project,
          # or the release goes out short.
          test "$(ls git-time-* | wc -l)" -eq 4
          for binary in git-time-*; do
            test -s "$binary"
            file "$binary" | grep -Eq 'Mach-O|ELF'
          done
          ls -l

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/git-time-*
          fail_on_unmatched_files: true
          generate_release_notes: true
