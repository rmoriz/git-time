name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Re-pointing a tag supersedes its run: the stale one would otherwise hold
# macOS runner slots and publish assets from a commit nobody points at.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tag push also triggers CI, but nothing made the release wait for it:
  # without this gate a failing suite still publishes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  binaries:
    uses: ./.github/workflows/binaries.yml
    with:
      retention-days: 7

  release:
    needs: [binaries, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The build jobs stage bare binaries, so the release attaches exactly
      # those: no archive and no checksum file to fetch alongside, one asset per
      # target, named after it.
      - name: Check the assets
        run: |
          set -eu
          cd dist
          chmod +x git-time-*
          # Four targets, and each one has to be an executable of this project,
          # or the release goes out short.
          test "$(ls git-time-* | wc -l)" -eq 4
          for binary in git-time-*; do
            test -s "$binary"
            file "$binary" | grep -Eq 'Mach-O|ELF'
          done
          ls -l

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/git-time-*
          fail_on_unmatched_files: true
          generate_release_notes: true
