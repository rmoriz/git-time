[workspace]
resolver = "3"
members = ["crates/git-time-core", "crates/git-time-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Roland Moriz"]
license = "GPL-2.0-only"
repository = "https://github.com/rmoriz/git-time"
publish = false

[workspace.dependencies]
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
thiserror = "2"
proptest = "1"
zstd = "0.13"
base64 = "0.22"
tempfile = "3"
der = { version = "0.7", default-features = false, features = ["alloc"] }
cms = "0.2"
x509-cert = "0.2"
rustls-pki-types = "1"
sigstore-tsa = "0.16"
sigstore-types = "0.16"
rustls-webpki = "0.103"
aws-lc-rs = "1"
jiff = "0.2"
rand_core = "0.10"
rand = "0.10"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
axum = "0.8"
clap = "4"
