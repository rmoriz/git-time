[workspace]
resolver = "3"
members = ["crates/git-time-core", "crates/git-time-cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Roland Moriz"]
license = "GPL-2.0-only"
repository = "https://github.com/rmoriz/git-time"
publish = false

[workspace.dependencies]
sha1 = { version = "0.11", features = ["oid"] }
sha2 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
thiserror = "2"
proptest = "1"
zstd = "0.13"
base64 = "0.22"
tempfile = "3"
der = { version = "0.8", default-features = false, features = ["alloc"] }
cms = "0.3.0-rc.2"
x509-cert = "0.3"
rustls-pki-types = "1"
sigstore-tsa = "0.16"
sigstore-types = "0.16"
rustls-webpki = "0.103"
aws-lc-rs = "1"
jiff = "1.0"
rand_core = "0.10"
rand = "0.10"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
axum = "0.8"
clap = "4"

# Lints every crate inherits with `[lints] workspace = true`.
#
# This tool rewrites commit objects and moves refs, so a memory-safety bug is not
# a crash but a wrong commit: there is no `unsafe` here to get wrong, and none
# should be added. The level is `deny` rather than `forbid` because there are
# exactly two kinds of justified exception — the binary restores the default
# `SIGPIPE` disposition through one reviewed FFI call, and the test harnesses
# set process environment (and one wraps the global allocator) — and each site
# opts in with a reasoned `allow`. `undocumented_unsafe_blocks` is what keeps
# such an `allow` from landing without its SAFETY argument.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# The pairings live in `clippy.toml`; this turns the lint on outside the
# restriction group so the list is enforced by a normal `cargo clippy`.
disallowed_methods = "deny"
