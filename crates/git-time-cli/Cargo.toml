[package]
name = "git-time-cli"
description = "Command line interface for git-time"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "git-time"
path = "src/main.rs"

[dependencies]
git-time-core = { path = "../git-time-core" }
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
cms.workspace = true
der.workspace = true
rand.workspace = true
reqwest.workspace = true
serde_json = "1"
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
x509-cert.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
serde_json = "1"
sha2.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tempfile.workspace = true
