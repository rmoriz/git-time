# Policy for `cargo deny check`, run by CI.
#
# Advisories are the point of this file: an unpatched RUSTSEC entry fails the
# build instead of waiting to be noticed. The license list is the set the tree
# actually carries as of 0.2.0; a dependency under a different license needs a
# decision here rather than a silent pass. `multiple-versions` stays allowed —
# the RustCrypto stack legitimately runs generations side by side during a
# migration — while wildcard requirements do not.
#
# This file judges the *dependencies*. `unsafe` in this workspace's own code is
# not visible to cargo-deny; it is denied by `[workspace.lints]` in the root
# manifest, and the two reviewed exceptions are marked there.

[graph]
# Check the dependency graph as each released target sees it, not just as the CI
# host does: a crate that is only pulled in on another OS is still shipped, and
# its licence, bans and advisories have to pass here. Keep this list in step
# with the targets in `.github/workflows/release.yml`.
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
# A yank is news, not an outage: Cargo.lock pins exact versions.
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-2.0-only",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
